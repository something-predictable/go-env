version: "2"

# spell-checker: ignore depguard ireturn nlreturn staticcheck nolintlint cyclop ints
linters:
  default: all
  disable:
    - depguard
    - ireturn
    - nlreturn
    - wsl
    - wsl_v5
  settings:
    staticcheck:
      checks:
        - -ST1000
    cyclop:
      max-complexity: 30
      package-average: 0
    nolintlint:
      allow-unused: true
      require-explanation: false
      require-specific: true
    revive:
      enable-all-rules: true
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: add-constant
          arguments:
            - allowInts: '0,1'
        - name: cyclomatic
          arguments:
            - 30
        - name: cognitive-complexity
          arguments:
            - 30
