version: "2"

# spell-checker: ignore depguard ireturn nlreturn nolintlint cyclop ints
linters:
  default: all
  disable:
    - depguard
    - ireturn
    - nlreturn
    - varnamelen
    - wsl
    - wsl_v5
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
  settings:
    staticcheck:
      checks:
        - -ST1000
    cyclop:
      max-complexity: 30
      package-average: 0
    funlen:
      lines: 100
      statements: 40
      ignore-comments: true
    nolintlint:
      allow-unused: true
      require-explanation: false
      require-specific: true
    gocritic:
      disabled-checks:
        - singleCaseSwitch
    revive:
      enable-all-rules: true
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: import-alias-naming
          arguments:
            - "^[a-z][a-z0-9_]{0,}$"
        - name: nested-structs
          disabled: true
        - name: add-constant
          arguments:
            - allowInts: '0,1,0600,0644'
        - name: argument-limit
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: cyclomatic
          arguments:
            - 30
        - name: cognitive-complexity
          arguments:
            - 30
        - name: function-length
          arguments: [40, 100]
